<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Sign In</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="w-[380px] rounded-2xl border border-base-600 bg-base-800 p-8 shadow-2xl">
      <h1 class="mb-1 text-center text-2xl font-bold">Welcome</h1>
      <p class="mb-5 text-center text-sm text-slate-400">Sign in or create an account</p>

      <div class="mb-5 flex gap-2 rounded-xl bg-base-900 p-1">
        <button
          id="tab-login"
          type="button"
          class="flex-1 rounded-lg bg-brand px-3 py-2 text-sm font-semibold text-white transition"
        >
          Login
        </button>
        <button
          id="tab-register"
          type="button"
          class="flex-1 rounded-lg px-3 py-2 text-sm font-semibold text-slate-400 transition hover:text-slate-200"
        >
          Register
        </button>
      </div>

      <form id="auth-form">
        <label for="username" class="mb-1 block text-xs text-slate-400">Username</label>
        <input
          id="username"
          type="text"
          autocomplete="username"
          required
          class="w-full rounded-lg border border-base-600 bg-base-900 px-3 py-2.5 text-sm text-slate-200 outline-none transition focus:border-brand"
        />

        <label for="password" class="mb-1 mt-3 block text-xs text-slate-400">Password</label>
        <div class="relative">
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
            class="w-full rounded-lg border border-base-600 bg-base-900 px-3 py-2.5 pr-11 text-sm text-slate-200 outline-none transition focus:border-brand"
          />
          <button
            id="toggle-password"
            type="button"
            aria-label="Show password"
            title="Show/hide password"
            class="absolute inset-y-0 right-2 my-auto flex h-7 w-7 items-center justify-center rounded-md text-slate-400 transition hover:bg-base-700 hover:text-slate-200"
          >
            <svg
              id="eye-open"
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg
              id="eye-closed"
              xmlns="http://www.w3.org/2000/svg"
              class="hidden h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"
              />
            </svg>
          </button>
        </div>

        <button
          id="submit-btn"
          type="submit"
          class="mt-5 w-full rounded-lg bg-brand px-3 py-3 text-sm font-semibold text-white transition hover:bg-brand-dark active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60"
        >
          Login
        </button>
      </form>

      <p id="message" class="mt-3.5 min-h-[20px] text-center text-sm" role="alert"></p>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
